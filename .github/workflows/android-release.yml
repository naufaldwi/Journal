name: Build & Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK & SHA-256 checksum
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-snapshot}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/journal-${TAG_NAME}.apk"
          (cd dist && sha256sum "journal-${TAG_NAME}.apk" > "journal-${TAG_NAME}.apk.sha256")

      - name: Build signed release APK (when signing secrets are set)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-snapshot}"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${KEYSTORE_PATH}"
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "dist/journal-${TAG_NAME}-release.apk"
          (cd dist && sha256sum "journal-${TAG_NAME}-release.apk" > "journal-${TAG_NAME}-release.apk.sha256")
          rm -f "${KEYSTORE_PATH}"

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: journal-android-apk
          path: dist/*

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
